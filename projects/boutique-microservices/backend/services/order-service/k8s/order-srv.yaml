kind: Deployment 
apiVersion: apps/v1

metadata:
  name: boutique-order-srv-deployment
  namespace: boutique 
  labels:
    app: order-srv


spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-srv
  template:
    metadata:
      labels:
        app: order-srv
    spec:
      containers:
        - name: boutique-order-srv 
          image: mishranishant/boutique-order-srv:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          env:
            - name: NODE_ENV
              value: "development"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-cred
                  key: DBurl
            - name: AUTH_SERVICE_URL
              value: "http://boutique-auth-service:3002"
            - name: PRODUCTS_SERVICE_URL
              value: "http://boutique-products-service:3003"

---


kind: Service
apiVersion: v1

metadata:
  name: boutique-order-service
  namespace: boutique

spec:
  type: NodePort

  ports:
    - port: 3004
      targetPort: 3004
      nodePort: 32004
      protocol: TCP
      name: http
  selector:
    app: order-srv
