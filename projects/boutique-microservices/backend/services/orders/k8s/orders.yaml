kind: Deployment
apiVersion: apps/v1

metadata:
  name: boutique-orders-deployment
  namespace: boutique
  labels:
    app: orders


spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders

  template:
    metadata:
      labels:
        app: orders

    spec:
      containers:
        - name: boutique-orders
          image: mishranishant/boutique-orders:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3005
          env:
            - name: NODE_ENV
              value: "development"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ordersdburl
                  key: DBurl

---

kind: Service
apiVersion: v1

metadata:
  name: boutique-orders-service
  namespace: boutique

spec:
  type: NodePort
  ports:
    - port: 3005
      targetPort: 3005
      nodePort: 32005
      protocol: TCP
      name: http 
  selector:
    app: orders
