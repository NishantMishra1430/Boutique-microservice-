kind: Deployment
apiVersion: apps/v1

metadata: 
  name: boutique-user-deployment
  namespace: boutique
  labels:
    app: user 

spec:
  replicas: 2
  selector:
    matchLabels:
      app: user

  template:
    metadata:
      labels:
        app: user

    spec:
      containers:
        - name: boutique-user
          image: mishranishant/boutique-user:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3006
          env:
            - name: NODE_ENV
              value: "development"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: userdburl
                  key: DBurl


---

kind: Service
apiVersion: v1

metadata:
  name: boutique-user-service
  namespace: boutique

spec:
  type: NodePort
  ports:
    - port: 3006
      targetPort: 3006
      nodePort: 32007
      protocol: TCP
      name: http

  selector:
    app: user


