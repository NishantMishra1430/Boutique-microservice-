apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-postgres-init
  namespace: boutique
data:
  init.sql: |
    CREATE DATABASE auth_db;
    CREATE DATABASE products_db;
    CREATE DATABASE orders_db;
    CREATE DATABASE users_db;

---

apiVersion: v1
kind: Service
metadata:
  name: boutique-postgres-service
  namespace: boutique
spec:
  clusterIP: None    
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: boutique-postgres
  namespace: boutique
spec:
  serviceName: "boutique-postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres123"
          
          
          volumeMounts:
            
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/
              

      volumes:
        - name: init-scripts
          configMap:
            name: boutique-postgres-init


  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi 